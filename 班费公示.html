<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>栖心一班班费公示</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* Layout: top bar (back to dashboard) → masthead with month switcher (‹ select ›) → ① 本期收支（income / expense side by side, donors）② 支出明细 ③ 结余 ④ 每月收支表（rows switch month）⑤ 缴纳班费. Each month's report is stored by the backend; switching fetches that month. */
:root{
  --bg:#f3f4f7; --card:#ffffff; --ink:#1b2130; --muted:#6a7284; --line:#dde1e8; --soft:#eef0f4;
  --accent:#36479f; --accent-ink:#ffffff; --accent-soft:#e6e9f7; --accent-deep:#263378;
  --in:#1d7a4e; --in-bg:#e3f3ea; --out:#b6412b; --out-bg:#f8e6e1;
  --shadow:0 1px 2px rgba(20,25,40,.05),0 8px 24px -12px rgba(20,25,40,.18);
  --display:'Noto Serif SC','Songti SC','SimSun',serif;
  --body:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13161d; --card:#1c2029; --ink:#e7e9ef; --muted:#9aa2b3; --line:#2d3340; --soft:#242933;
  --accent:#95a3f2; --accent-ink:#10142a; --accent-soft:#242a45; --accent-deep:#c3cbfa;
  --in:#62cf93; --in-bg:#163322; --out:#f29078; --out-bg:#3a1f18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#13161d; --card:#1c2029; --ink:#e7e9ef; --muted:#9aa2b3; --line:#2d3340; --soft:#242933;
  --accent:#95a3f2; --accent-ink:#10142a; --accent-soft:#242a45; --accent-deep:#c3cbfa;
  --in:#62cf93; --in-bg:#163322; --out:#f29078; --out-bg:#3a1f18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0;padding-block:0 56px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent)}

nav.top{position:sticky;top:0;z-index:9;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
nav.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;height:54px}
nav.top .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:17px;white-space:nowrap;color:var(--ink);text-decoration:none}
nav.top .seal{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
nav.top .brand small{font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.08em}
nav.top a.back{color:var(--muted);text-decoration:none;font-size:14px;padding:6px 11px;border-radius:999px;white-space:nowrap}
nav.top a.back:hover{background:var(--accent-soft);color:var(--accent-deep)}
nav.top a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:640px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-top:22px}
header.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 0 6px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--accent);font-weight:600;text-transform:uppercase}
h1{font-family:var(--display);font-size:28px;font-weight:700;margin:2px 0 0;letter-spacing:.02em;line-height:1.2;text-wrap:balance}
.asof{font-size:13px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.mnav{display:flex;align-items:center;gap:6px}
.mnav button{font:inherit;font-size:18px;line-height:1;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--accent);cursor:pointer}
.mnav button:disabled{color:var(--line);cursor:default}
select.month{font:inherit;font-size:14px;font-weight:600;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0}
select.month:focus-visible,.mnav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ② expense details */
.ex{margin:0;padding:0;list-style:none}
.ex li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.ex li:last-child{border-bottom:0}
.ex .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ex .c{font-weight:600;font-size:14.5px;overflow-wrap:anywhere} .ex .c span{font-weight:400;color:var(--muted)}
.ex .n{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ex b{color:var(--out);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-family:var(--display);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.01em}
.big small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}

/* ① income / expense */
.io{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){ .io{grid-template-columns:1fr} }
.io>div{background:var(--soft);border-radius:11px;padding:12px 14px;min-width:0;display:grid;align-content:start;gap:4px}
.io .k{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.io .k i{width:7px;height:7px;border-radius:50%;background:var(--in);display:inline-block}
.io .out .k i{background:var(--out)}
.io .v{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.io .in .v{color:var(--in)} .io .out .v{color:var(--out)}
.io .v small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);margin-left:4px}
.io ul{margin:4px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted);display:grid;gap:2px}
.io li{display:flex;justify-content:space-between;gap:10px} .io li b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.io li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.donors{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13.5px;line-height:1.7}
.donors .lead{color:var(--muted);margin-right:4px}
.donors .nm{display:inline-block;background:var(--in-bg);color:var(--in);border-radius:999px;padding:1px 10px;margin:2px 4px 2px 0;font-weight:600}

/* ② balance */
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.split>div{background:var(--soft);border-radius:9px;padding:10px 12px;min-width:0}
.split .k{font-size:12px;color:var(--muted)} .split .v{font-weight:600;font-variant-numeric:tabular-nums;font-size:17px;overflow-wrap:anywhere}
.pl{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted);display:grid;gap:3px}
.pl li{display:flex;justify-content:space-between;gap:10px} .pl li b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

/* ③ monthly table */
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.cur td{font-weight:600;background:var(--accent-soft)}
.tbl tbody tr{cursor:pointer} .tbl tbody tr:hover td{background:var(--soft)} .tbl tbody tr.cur:hover td{background:var(--accent-soft)}
.tbl td.i{color:var(--in)} .tbl td.o{color:var(--out)}
.tbl tfoot td{border-bottom:0;color:var(--muted);font-size:13px;padding-top:10px}
.twrap{overflow-x:auto;margin:0 -4px}

.empty{color:var(--muted);font-size:13.5px;padding:6px 0}
footer{font-size:12.5px;color:var(--muted);line-height:1.65;padding:0 4px}
.pay{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.pay img{width:150px;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
.pay .h{font-family:var(--display);font-size:17px;font-weight:700}
.pay .acct{font-family:ui-monospace,Menlo,monospace;font-size:15px;margin:4px 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pay .acct button{font:inherit;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--accent);cursor:pointer}
.pay .tip{font-size:13px;color:var(--muted);line-height:1.6}
@media (max-width:420px){ .pay{grid-template-columns:1fr} .pay img{width:180px} }
</style>
</head>
<body>
<nav class="top gutter"><div class="in">
  <a class="brand" href="./"><span class="seal">栖</span>栖心一班<small>班费公示</small></a>
  <a class="back" href="./">班级看板 ›</a>
</div></nav>

<div class="wrap gutter">
  <header class="mast">
    <div><div class="eyebrow">MindfulPeace · 静心学堂</div><h1 id="title">班费公示</h1><div class="asof" id="asof">读取中…</div></div>
    <div class="mnav" id="mnav" hidden><button type="button" id="prevM" aria-label="上一个月">‹</button><select class="month" id="month" aria-label="选择月份"></select><button type="button" id="nextM" aria-label="下一个月">›</button></div>
  </header>
  <main id="app" style="display:contents"><section><div class="empty">正在读取最近一期公示…</div></section></main>
  <section id="pay" hidden><h2>缴纳班费</h2><div class="pay"><img id="qrImg" alt="班费收款码"><div><div class="h" id="qrName"></div><div class="acct"><span id="qrHandle"></span><button type="button" id="qrCopy">复制账号</button></div><div class="tip">Venmo 扫码或搜索账号转账，备注写<b>法名 + 班费</b>；指定用途的供养请在备注里写明用途。</div></div></div></section>
  <footer>班费收入分两类：<b>随喜供养</b>（非限定用途）与<b>专项供养</b>（指定用途，专款专用）。本页公示收支汇总与每笔支出；凭证由记账义工保管，有疑问请联系班委。</footer>
</div>
<script src="banfei.config.js"></script>
<script src="gate.js"></script>
<script>
(function () {
const $ = id => document.getElementById(id);
const API = (window.BANFEI_API || '').trim();
const fmt = n => (n < 0 ? '-' : '') + '$' + Math.abs(+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const md = s => { const [, m, d] = String(s).split('-'); return (+m || 0) + '/' + (+d || 0); };
const ym = s => { const [y, m] = String(s).split('-'); return (+y || 0) + '年' + (+m || 0) + '月'; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cache = {}; let months = [], data = null;

function render() {
  if (!data) { $('asof').textContent = '尚未发布'; $('app').innerHTML = '<section><div class="empty">记账义工发布第一期公示后，这里会显示收支汇总与结余。</div></section>'; return; }
  const r = data; if (!r.month) r.month = String(r.asOf || '').slice(0, 7);
  const M = r.current ? '本月' : (+r.month.slice(5)) + '月';
  const pubAt = r.publishedAt ? new Date(r.publishedAt).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
  $('title').textContent = '班费公示 · ' + ym(r.month);
  $('asof').textContent = '截至 ' + md(r.asOf) + (r.current ? '' : '（月末）') + (pubAt ? ' · 发布于 ' + pubAt : '');
  const inLines = r.nIn ? [`<li><span>随喜供养</span><b>${fmt(r.inFree)}</b></li>`].concat((r.inRestricted || []).map(p => `<li><span>专项·${esc(p.purpose)}</span><b>${fmt(p.amount)}</b></li>`)) : [];
  const outLines = (r.expense || []).map(c => `<li><span>${esc(c.category)}</span><b>${fmt(c.amount)}</b></li>`);
  const restricted = r.restricted || [], rBal = restricted.reduce((a, p) => a + (+p.balance || 0), 0);
  let run = 0; const asc = [...(r.monthly || [])].sort((a, b) => a.month < b.month ? -1 : 1).map(m => ({ ...m, bal: (run += (+m.in || 0) - (+m.out || 0)) }));
  const rows = asc.reverse();
  $('app').innerHTML = `
    <section><h2>${M}收支</h2>
      <div class="io">
        <div class="in"><div class="k"><i></i>收入${r.nIn ? ` · ${r.nIn} 笔` : ''}</div><div class="v">${fmt(r.monthIn)}</div>${inLines.length ? '<ul>' + inLines.join('') + '</ul>' : ''}</div>
        <div class="out"><div class="k"><i></i>支出${r.nOut ? ` · ${r.nOut} 笔` : ''}</div><div class="v">${fmt(r.monthOut)}</div>${outLines.length ? '<ul>' + outLines.join('') + '</ul>' : ''}</div>
      </div>
      ${(r.donors || []).length ? `<div class="donors"><span class="lead">随喜以下师兄${M}的供养</span><br>${r.donors.map(n => `<span class="nm">${esc(n)}</span>`).join('')}</div>` : ''}
    </section>
    ${Array.isArray(r.expenses) ? `<section><h2>${M}支出明细<span>${r.expenses.length} 笔</span></h2>${r.expenses.length ? '<ul class="ex">' + r.expenses.map(e => `<li><span class="d">${md(e.date)}</span><div><div class="c">${esc(e.category)}${e.purpose ? `<span> · ${esc(e.purpose)}</span>` : ''}</div>${e.note ? `<div class="n">${esc(e.note)}</div>` : ''}</div><b>${fmt(e.amount)}</b></li>`).join('') + '</ul>' : `<div class="empty">${M}没有支出。</div>`}</section>` : ''}
    <section><h2>${r.current ? '当前' : '月末'}结余</h2><div class="big">${fmt(r.balance)}</div>
      <div class="split"><div><div class="k">随喜供养（非限定）</div><div class="v">${fmt(r.unrestricted)}</div></div><div><div class="k">专项供养（指定用途）</div><div class="v">${fmt(rBal)}</div></div></div>
      ${restricted.length ? '<ul class="pl">' + restricted.map(p => `<li><span>${esc(p.purpose)}</span><b>${fmt(p.balance)}</b></li>`).join('') + '</ul>' : ''}
    </section>
    <section><h2>每月收支</h2>
      ${rows.length ? `<div class="twrap"><table class="tbl"><thead><tr><th>月份</th><th>收入</th><th>支出</th><th>月末结余</th></tr></thead><tbody>${rows.map(m => `<tr class="${m.month === r.month ? 'cur' : ''}" data-m="${esc(m.month)}" title="查看${ym(m.month)}"><td>${ym(m.month)}</td><td class="i">${fmt(m.in)}</td><td class="o">${fmt(m.out)}</td><td>${fmt(m.bal)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="4">累计收入 ${fmt(r.totalIn)} · 累计支出 ${fmt(r.totalOut)} · 共 ${r.count} 笔</td></tr></tfoot></table></div>` : '<div class="empty">暂无记录。</div>'}
    </section>`;
}
function fillMonths() {
  const sel = $('month'), cur = new Date().toISOString().slice(0, 7);
  if (data && data.month && !months.includes(data.month)) months = [data.month, ...months];
  months = [...new Set(months)].sort().reverse();
  sel.innerHTML = months.map(m => `<option value="${esc(m)}">${ym(m)}${m === cur ? '（本月）' : ''}</option>`).join('');
  if (data) sel.value = data.month;
  const i = months.indexOf(sel.value);
  $('prevM').disabled = i < 0 || i >= months.length - 1;   // 列表从新到旧：‹ 往更早
  $('nextM').disabled = i <= 0;
  $('mnav').hidden = !months.length;
}
const go = m => { if (!m || (data && m === data.month)) return; show(m).catch(() => { $('asof').textContent = '读取失败'; }); };
async function show(month) {
  if (cache[month]) { data = cache[month]; render(); fillMonths(); return; }
  $('asof').textContent = '读取中…';
  const r = await QX.api('summary', { month });
  if (r && r.ok && r.summary) { cache[r.summary.month] = r.summary; data = r.summary; months = r.months || months; fillMonths(); }
  render(); fillMonths();
}
$('month').addEventListener('change', () => go($('month').value));
$('prevM').addEventListener('click', () => go(months[months.indexOf($('month').value) + 1]));
$('nextM').addEventListener('click', () => go(months[months.indexOf($('month').value) - 1]));
$('app').addEventListener('click', ev => { const tr = ev.target.closest('tr[data-m]'); if (tr) { go(tr.dataset.m); window.scrollTo({ top: 0, behavior: 'smooth' }); } });

if (!API) { $('asof').textContent = '未配置后端'; $('app').innerHTML = '<section><div class="empty">还没有配置后端地址，请先按 scripts/banfei/README.md 部署。</div></section>'; return; }
QX.ready().then(() => {
  QX.api('qr').then(r => { if (!(r && r.ok && r.dataUrl)) return; $('qrImg').src = r.dataUrl; $('qrName').textContent = r.name || ''; $('qrHandle').textContent = r.handle || ''; $('pay').hidden = false;
    $('qrCopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(r.handle || ''); $('qrCopy').textContent = '已复制'; setTimeout(() => $('qrCopy').textContent = '复制账号', 1800); } catch (_) {} });
  }).catch(() => {});
  return QX.api('summary');
}).then(r => { data = r && r.ok ? r.summary : null; months = (r && r.months) || []; if (data) cache[data.month] = data; fillMonths(); render(); })
  .catch(() => { $('asof').textContent = '读取失败'; $('app').innerHTML = '<section><div class="empty">暂时读不到数据，请稍后刷新。</div></section>'; });
})();
</script>
</body>
</html>
